<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="pt-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <linearGradient id="pt-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <style>
      @keyframes pulse-facet {
        0%, 100% { opacity: 0.45; transform: scale(0.97); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      .anim-h {
        animation: pulse-facet 2.2s ease-in-out infinite;
        transform-origin: 50% 50%;
      }
      .anim-cube-1 {
        animation: pulse-facet 2.2s ease-in-out infinite 0.3s;
        transform-origin: 50% 50%;
      }
      .anim-cube-2 {
        animation: pulse-facet 2.2s ease-in-out infinite 0.6s;
        transform-origin: 50% 50%;
      }
      .anim-facet-1 {
        animation: pulse-facet 2.2s ease-in-out infinite 0.2s;
        transform-origin: 50% 50%;
      }
      .anim-facet-2 {
        animation: pulse-facet 2.2s ease-in-out infinite 0.5s;
        transform-origin: 50% 50%;
      }
    </style>
  </defs>
  <!-- Top Right Blue Square -->
  <rect class="anim-cube-1" x="80" y="0" width="20" height="20" rx="3.5" fill="url(#pt-blue)" />
  <!-- Bottom Left Blue Square -->
  <rect class="anim-cube-2" x="0" y="80" width="20" height="20" rx="3.5" fill="url(#pt-blue)" />
  <!-- Top Orange Parallelogram -->
  <path class="anim-facet-1" d="M 9.5 0 L 57.5 0 Q 60 0 61.8 1.8 L 78.2 18.2 Q 80 20 77.5 20 L 29.5 20 Q 27 20 25.2 18.2 L 8.8 1.8 Q 7 0 9.5 0 Z" fill="url(#pt-orange)" />
  <!-- Bottom Orange Parallelogram -->
  <path class="anim-facet-2" d="M 90.5 100 L 42.5 100 Q 40 100 38.2 98.2 L 21.8 81.8 Q 20 80 22.5 80 L 70.5 80 Q 73 80 74.8 81.8 L 91.2 98.2 Q 93 100 90.5 100 Z" fill="url(#pt-orange)" />
  <!-- Central Blue H -->
  <path class="anim-h" d="M 0 60 L 0 9.5 Q 0 7 1.8 5.2 L 18.2 21.8 Q 20 23.5 20 26 L 20 40 L 80 40 L 80 22.5 Q 80 20 81.8 18.2 L 98.2 34.8 Q 100 36.5 100 39 L 100 90.5 Q 100 93 98.2 94.8 L 81.8 78.2 Q 80 76.5 80 74 L 80 60 L 20 60 L 20 77.5 Q 20 80 18.2 81.8 L 1.8 65.2 Q 0 63.5 0 60 Z" fill="url(#pt-blue)" />
</svg>
