[project]
name = "paperclip-meeting-service"
version = "0.1.0"
description = "High-performance Audio, VAD, and Whisper Streaming Transcription Service for Primbon / Paperclip"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-sock>=0.7.0",
    "flask-cors>=4.0.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
